name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Electron needs a few system libraries and a display to start on a
      # headless runner. The app itself already forces SwiftShader (see
      # src/main/index.ts), so software GL is enough for the audit.
      - name: Install Electron runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libnss3 libatk-bridge2.0-0 \
            libgtk-3-0 libasound2t64 libxshmfence1 || \
          sudo apt-get install -y xvfb libgbm1 libnss3 libatk-bridge2.0-0 \
            libgtk-3-0 libasound2 libxshmfence1

      # Placement invariants (see src/renderer/renderer3d/GeometryAudit.ts).
      # The budget is the known backlog, not a target — ratchet it DOWN as
      # defects are fixed, never up to make a red build green.
      - name: Geometry audit
        run: xvfb-run -a -s "-screen 0 1400x900x24" node tools/audit.mjs --max-errors=73
